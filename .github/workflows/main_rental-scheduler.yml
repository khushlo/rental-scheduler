# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - rental-scheduler

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "24.x"
          cache: "npm"

      - name: npm install, build, and test
        run: |
          npm ci
          # Ensure we're using Prisma 6.19.0 explicitly
          echo "Verifying Prisma version..."
          npm ls prisma @prisma/client
          # Force Prisma 6.19.0 to avoid v7 compatibility issues
          npx prisma@6.19.0 generate
          echo "Prisma client generated successfully"
          npm run build:prod
          npm run test --if-present
        env:
          NODE_ENV: production

      - name: Prepare static files and deployment package
        run: |
          mkdir -p deployment
          # Copy all standalone build content including .next directory
          cp -r .next/standalone/. deployment/

          # Copy the generated Prisma client (CRITICAL for Azure)
          echo "=== Copying Prisma client ==="
          if [ -d "node_modules/.prisma" ]; then
            mkdir -p deployment/node_modules/.prisma
            cp -r node_modules/.prisma deployment/node_modules/
            echo "Copied .prisma directory to deployment"
            ls -la deployment/node_modules/.prisma/
          fi
          if [ -d "node_modules/@prisma" ]; then
            mkdir -p deployment/node_modules/@prisma
            cp -r node_modules/@prisma deployment/node_modules/
            echo "Copied @prisma directory to deployment"
          fi

          # Ensure proper static file structure
          echo "=== Fixing static files structure ==="
          if [ -d ".next/static" ]; then
            # Remove any existing static directory in deployment/.next/
            rm -rf deployment/.next/static
            # Copy static files to correct location
            cp -r .next/static deployment/.next/
            echo "Copied .next/static to deployment/.next/static"
            ls -la deployment/.next/static/
          fi

          # Copy public directory if it exists
          if [ -d "public" ]; then
            cp -r public deployment/
            echo "Copied public directory"
          fi

      - name: Verify deployment package contents
        run: |
          echo "=== Final deployment package contents ==="
          ls -la deployment/
          echo "=== Checking for .next directory ==="
          ls -la deployment/.next/ || echo "ERROR: .next directory missing from deployment!"
          echo "=== Checking for Prisma client ==="
          ls -la deployment/node_modules/.prisma/ || echo "ERROR: .prisma directory missing!"
          ls -la deployment/node_modules/@prisma/ || echo "ERROR: @prisma directory missing!"
          echo "=== Checking static files ==="
          find deployment/.next/static -name "*.css" -o -name "*.js" | head -20
          echo "=== Total file count in deployment ==="
          find deployment/ -type f | wc -l

      - name: Rename .next to next-build for artifact preservation
        run: |
          if [ -d "deployment/.next" ]; then
            mv deployment/.next deployment/next-build
            echo "Renamed .next to next-build for artifact upload"
            ls -la deployment/next-build/
          fi

      - name: Rename .prisma to prisma-client for artifact preservation
        run: |
          if [ -d "deployment/node_modules/.prisma" ]; then
            mv deployment/node_modules/.prisma deployment/node_modules/prisma-client
            echo "Renamed .prisma to prisma-client for artifact upload"
            ls -la deployment/node_modules/prisma-client/
          fi

      - name: Rename .turbo to turbo-cache for artifact preservation
        run: |
          if [ -d "deployment/.turbo" ]; then
            mv deployment/.turbo deployment/turbo-cache
            echo "Renamed .turbo to turbo-cache for artifact upload"
          fi

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deployment/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Restore .next and .prisma directories and verify contents
        run: |
          echo "=== Downloaded artifact contents ==="
          ls -la ./
          echo "=== Checking for next-build directory ==="
          if [ -d "./next-build" ]; then
            mv ./next-build ./.next
            echo "Renamed next-build back to .next"
            ls -la ./.next/
          else
            echo "ERROR: next-build directory missing from downloaded artifact!"
          fi
          echo "=== Checking for prisma-client directory ==="
          if [ -d "./node_modules/prisma-client" ]; then
            mv ./node_modules/prisma-client ./node_modules/.prisma
            echo "Renamed prisma-client back to .prisma"
            ls -la ./node_modules/.prisma/
          else
            echo "ERROR: prisma-client directory missing from downloaded artifact!"
          fi
          echo "=== Checking for turbo-cache directory ==="
          if [ -d "./turbo-cache" ]; then
            mv ./turbo-cache ./.turbo
            echo "Renamed turbo-cache back to .turbo"
          fi
          echo "=== Final artifact contents after rename ==="
          ls -la ./
          echo "=== Total files in downloaded artifact ==="
          find ./ -type f | wc -l

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D8A713566E374A5B9C90AFCA8D9B30C0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B18DBDF671F645A5AFCF914907165AE0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A27C9BBDE42540E388835B6E8ACE685B }}

      - name: "Deploy to Azure Web App"
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "rental-scheduler"
          slot-name: "Production"
          package: .
          startup-command: "npx prisma@6.19.0 migrate deploy && npx prisma@6.19.0 generate && node server.js"
