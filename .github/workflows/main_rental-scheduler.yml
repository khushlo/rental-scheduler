# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - rental-scheduler

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "24.x"
          cache: "npm"

      - name: npm install, build, and test
        run: |
          npm ci
          npx prisma generate
          npm run build:prod
          npm run test --if-present
        env:
          NODE_ENV: production

      - name: Prepare static files and deployment package
        run: |
          mkdir -p deployment
          # Copy all standalone build content including .next directory
          cp -r .next/standalone/. deployment/
          # Copy additional static files if they exist
          if [ -d ".next/static" ]; then
            mkdir -p deployment/.next/static
            cp -r .next/static deployment/.next/static/
          fi
          # Copy public directory if it exists
          if [ -d "public" ]; then
            cp -r public deployment/
          fi

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deployment/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D8A713566E374A5B9C90AFCA8D9B30C0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B18DBDF671F645A5AFCF914907165AE0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A27C9BBDE42540E388835B6E8ACE685B }}

      - name: "Deploy to Azure Web App"
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "rental-scheduler"
          slot-name: "Production"
          package: .
